name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Run Ruff Check
      run: |
        uv pip install ruff
        uv run ruff check tests/test_pim_search.py pages/pim_page.py

    - name: Install Playwright Browsers
      run: uv run playwright install --with-deps

    - name: Run PIM Search Test Only
      run: uv run pytest tests/test_pim_search.py